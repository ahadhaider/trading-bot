name: Build Python APK Manually

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              python3-dev \
              ant \
              openjdk-17-jdk \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libportmidi-dev \
              libswscale-dev \
              libavformat-dev \
              libavcodec-dev \
              zlib1g-dev \
              unzip \
              wget

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Correct SDK Layout and Preinstall Build-Tools 37
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR/cmdline-tools
          cd $SDK_DIR/cmdline-tools
          
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -o tools.zip
          rm -rf latest
          mv cmdline-tools latest
          rm tools.zip
          
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-31" "build-tools;37.0.0"

      - name: Build APK with Buildozer
        env:
          BUILDER_SAFETY_FACTOR: 1
        run: |
          buildozer -v android release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-bot-apk
          path: bin/*.apk
