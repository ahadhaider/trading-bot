name: Build Python APK Manually

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      BUILDER_SAFETY_FACTOR: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              python3-dev \
              ant \
              openjdk-17-jdk \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libportmidi-dev \
              libswscale-dev \
              libavformat-dev \
              libavcodec-dev \
              zlib1g-dev \
              unzip \
              wget

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Setup Exact SDK Structure for Buildozer Legacy Path
        run: |
          mkdir -p $ANDROID_HOME/tools/bin
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          
          cd $ANDROID_HOME
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -o tools.zip
          
          # Copy to both locations so buildozer finds it no matter what it looks for
          cp -r cmdline-tools/* tools/
          cp -r cmdline-tools/* cmdline-tools/latest/
          rm tools.zip
          
          # Accept licenses
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          
          export PATH="$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-31" "build-tools;37.0.0"

      - name: Build APK with Buildozer
        run: |
          buildozer -v android release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-bot-apk
          path: bin/*.apk
